<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cointrol Gratis</title>
  <meta name="description" content="Control de gastos, ingresos y ahorro con estilo de videojuego. Tus datos se guardan solo en tu móvil.">
  <meta name="theme-color" content="#1a1c2c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="../fonts/vt323.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../fonts/press-start-2p.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../css/game.css">
</head>
<body>
  <header class="topbar">
    <img src="../icons/logo-pixel.png" alt="" class="topbar-logo">
    <h1 id="title">Cointrol</h1>
    <div class="hud" id="hud"></div>
  </header>

  <main id="view" class="view"></main>

  <button id="fab" class="fab" aria-label="Añadir movimiento">+</button>

  <nav class="tabbar" id="tabbar">
    <button data-nav="base"><span class="ti">🏰</span><span>Base</span></button>
    <button data-nav="diario"><span class="ti">📜</span><span>Diario</span></button>
    <button data-nav="stats"><span class="ti">📊</span><span>Stats</span></button>
    <button data-nav="misiones"><span class="ti">⚔️</span><span>Misiones</span></button>
    <button data-nav="mochila"><span class="ti">🎒</span><span>Mochila</span></button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true"><div id="sheet-body"></div></div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="edition.js"></script>
  <script src="../js/core.js"></script>
  <script src="../js/game.js"></script>
  <script src="../js/views.js"></script>
  <script src="../js/forms.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/pro.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
